name: Daily (天气+名言)

on:
  workflow_dispatch:  # 唯一入口:Cloudflare cron 每天北京 05:30 通过 API 触发
  # 注意:勿加 on: push 触发器,否则 push_history 的自动 commit 会触发自循环

concurrency:
  group: daily
  cancel-in-progress: false

# contents:write 让 daily.py 经 Contents API 写回 quotes_history.json
permissions:
  contents: write

jobs:
  daily:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate & send daily weather + quote
        env:
          GLM_API_KEY: ${{ secrets.GLM_API_KEY }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python daily.py

      - name: Alert on failure
        if: failure()
        env:
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
        run: |
          python - <<'PYEOF'
          import smtplib, os
          from email.mime.text import MIMEText
          msg = MIMEText('每日天气+名言任务失败,请查看运行日志:\nhttps://github.com/aloysk/aihot-daily/actions', 'plain', 'utf-8')
          msg['Subject'] = '⚠ 每日推送失败告警'
          msg['From'] = msg['To'] = 'xi.ke0709@gmail.com'
          with smtplib.SMTP('smtp.gmail.com', 587, timeout=30) as s:
              s.starttls()
              s.login('xi.ke0709@gmail.com', os.environ['GMAIL_APP_PASSWORD'])
              s.send_message(msg)
          PYEOF
